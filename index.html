<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperación de cuenta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="loginView" class="container is-hidden">

        <section class="card access-card">

            <div class="logo" aria-hidden="true">夜</div>

            <h1>Acceso protegido</h1>

            <p class="description">
                Introduce la contraseña para abrir el formulario de recuperación.
            </p>

            <form id="loginForm">
                <label for="loginUsername">Usuario</label>
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Introduce tu usuario"
                    autocomplete="username"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Introduce la contraseña"
                    autocomplete="current-password"
                    required
                >
                <button type="submit">Entrar</button>
            </form>

            <p id="loginMessage" class="message" role="alert"></p>

        </section>

    </main>

    <main id="appView" class="container">

        <section class="card">

            <div class="logo">夜</div>

            <h1>Recuperación de cuenta</h1>

            <p id="activeUser" class="active-user"></p>

            <p class="description">
                Ingresa tu usuario y repítelo para enviar tu solicitud.
            </p>

            <form id="recoveryForm">

                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >

                <label for="usernameConfirmation">
                    Repite el usuario
                </label>

                <input
                    type="text"
                    id="usernameConfirmation"
                    placeholder="Repite tu usuario"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Continuar
                </button>

            </form>

            <p id="message" class="message" role="status"></p>

            <button id="adminLoginButton" class="link-button" type="button">Acceso administrador</button>

            <section id="recordsSection" class="records is-hidden" aria-labelledby="recordsTitle">
                <div class="records-heading">
                    <h2 id="recordsTitle">Solicitudes guardadas</h2>
                    <button id="clearButton" class="secondary-button" type="button">Borrar todo</button>
                </div>
                <p id="emptyMessage" class="empty-message">Todavía no hay solicitudes.</p>
                <ul id="recordsList"></ul>
            </section>

            <button id="logoutButton" class="link-button is-hidden" type="button">Cerrar sesión</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
